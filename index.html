<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delfzijl Live Carousel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #090d16;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
    
    .card-container {
      width: 90vw;
      max-width: 420px;
      height: 220px;
      position: relative;
    }

    .slide {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: #1e293b;
      border: 2px solid #334155;
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.6s ease-in-out, visibility 0.6s;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }

    .slide.active {
      opacity: 1;
      visibility: visible;
    }

    .slide-title {
      font-size: 0.9rem;
      color: #38bdf8;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }

    .value-big {
      font-size: 2rem;
      font-weight: 800;
      color: #ffffff;
    }

    .subtitle {
      font-size: 1rem;
      color: #94a3b8;
      margin-top: 6px;
    }

    /* RDW Kenteken Geel Plaatje */
    .license-plate {
      background: #facc15;
      color: #000;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 900;
      letter-spacing: 3px;
      border: 3px solid #000;
      font-family: monospace;
      font-size: 2.2rem;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    }

    /* Voortgangsindicatoren onderin */
    .dots {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #334155;
      transition: background 0.3s;
    }
    .dot.active {
      background: #38bdf8;
      width: 24px;
      border-radius: 5px;
    }

    .last-update {
      position: absolute;
      bottom: 10px;
      font-size: 0.75rem;
      color: #64748b;
    }
  </style>
</head>
<body>

  <div class="card-container">
    <!-- SLIDE 1: RDW KENTEKEN -->
    <div class="slide active">
      <div class="slide-title">RDW Laatste Kenteken</div>
      <div id="kenteken" class="license-plate">...</div>
      <div class="subtitle">Nederland Live</div>
    </div>

    <!-- SLIDE 2: WEER DELFZIJL -->
    <div class="slide">
      <div class="slide-title">Actueel Weer Delfzijl</div>
      <div id="weer-temp" class="value-big">-- °C</div>
      <div id="weer-wind" class="subtitle">Wind: -- km/h</div>
    </div>

    <!-- SLIDE 3: WATERSTAND DELFZIJL -->
    <div class="slide">
      <div class="slide-title">Waterstand Eems / Delfzijl</div>
      <div id="waterstand" class="value-big" style="color: #38bdf8;">-- cm</div>
      <div class="subtitle">t.o.v. NAP</div>
    </div>

    <!-- SLIDE 4: VERKEER N33 -->
    <div class="slide">
      <div class="slide-title">Verkeersstatus N33</div>
      <div id="verkeer" class="value-big" style="color: #4ade80; font-size: 1.6rem;">Geen Hinder</div>
      <div class="subtitle">Regio Delfzijl</div>
    </div>
  </div>

  <!-- Bollen voor actieve slide -->
  <div class="dots">
    <div class="dot active"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>

  <div id="last-update" class="last-update">Update: Laden...</div>

  <script>
    // --- 1. SLIDESHOW LOGICA ---
    let currentSlide = 0;
    const slides = document.querySelectorAll('.slide');
    const dots = document.querySelectorAll('.dot');

    function nextSlide() {
      slides[currentSlide].classList.remove('active');
      dots[currentSlide].classList.remove('active');

      currentSlide = (currentSlide + 1) % slides.length;

      slides[currentSlide].classList.add('active');
      dots[currentSlide].classList.add('active');
    }

    // Wissel elke 6 seconden van slide
    setInterval(nextSlide, 6000);

    // --- 2. LIVE DATA LOGICA (Elke 1 minuut) ---
    async function updateData() {
      // 1. RDW Kenteken
      try {
        const res = await fetch('https://opendata.rdw.nl/resource/m9d7-ebf2.json?$limit=1&$order=:id%20DESC');
        const data = await res.json();
        if (data.length > 0) {
          document.getElementById('kenteken').innerText = data[0].kenteken;
        }
      } catch (e) { console.error('RDW Fout', e); }

      // 2. Weer Delfzijl (Open-Meteo)
      try {
        const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=53.3342&longitude=6.9239&current_weather=true');
        const data = await res.json();
        document.getElementById('weer-temp').innerText = data.current_weather.temperature + ' °C';
        document.getElementById('weer-wind').innerText = 'Wind: ' + data.current_weather.windspeed + ' km/h';
      } catch (e) { console.error('Weer Fout', e); }

      // 3. Waterstand Delfzijl (Rijkswaterstaat)
      try {
        const res = await fetch('https://waterlinenews.rws.nl/api/waterstand/DELFZL');
        const data = await res.json();
        if (data && data.value !== undefined) {
          document.getElementById('waterstand').innerText = Math.round(data.value) + ' cm';
        }
      } catch (e) { console.error('Waterstand Fout', e); }

      // Tijdstip bijwerken
      const now = new Date();
      document.getElementById('last-update').innerText = 'Data ververst: ' + now.toLocaleTimeString('nl-NL');
    }

    // Ophalen bij opstarten en daarna exact elke 60 seconden (1 minuut)
    updateData();
    setInterval(updateData, 60000);
  </script>
</body>
</html>
